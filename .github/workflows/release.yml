name: Release Theme

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Build CSS
      run: npm run build:css

    - name: Package Theme
      run: |
        mkdir -p /tmp/astrofy-wp
        rsync -a --exclude='node_modules' --exclude='.git' --exclude='.github' --exclude='.claude' \
          --exclude='tailwind.config.js' --exclude='package.json' --exclude='package-lock.json' \
          --exclude='.wp-env.json' --exclude='.gitignore' --exclude='.DS_Store' \
          --exclude='assets/css/tailwind-src.css' \
          ./ /tmp/astrofy-wp/
        cd /tmp && zip -r "$GITHUB_WORKSPACE/astrofy-wp.zip" astrofy-wp/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: astrofy-wp.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
